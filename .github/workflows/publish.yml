name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXTRA="${VERSION#*-}"
          BASE_VERSION="${VERSION%%-*}"

          if [ "$EXTRA" = "$VERSION" ]; then
            EXTRA=""
          fi

          INSTALL_CMD="pip install light-server"
          if [ -n "$EXTRA" ]; then
            INSTALL_CMD="pip install light-server[${EXTRA}]"
          fi

          NOTES="## Install

\`\`\`bash
${INSTALL_CMD}==${BASE_VERSION}
\`\`\`

### All extras

| Extra | Command |
|-------|---------|
| (none) | \`pip install light-server==${BASE_VERSION}\` |
| http | \`pip install light-server[http]==${BASE_VERSION}\` |
| grpc | \`pip install light-server[grpc]==${BASE_VERSION}\` |
| all | \`pip install light-server[all]==${BASE_VERSION}\` |"

          gh release create "${TAG}" \
            --notes "${NOTES}" \
            dist/*

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
