name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXTRA="${VERSION#*-}"
          BASE_VERSION="${VERSION%%-*}"

          if [ "$EXTRA" = "$VERSION" ]; then
            EXTRA=""
          fi

          INSTALL_CMD="pip install light-server"
          if [ -n "$EXTRA" ]; then
            INSTALL_CMD="pip install light-server[${EXTRA}]"
          fi

          NOTES="## Install

\`\`\`bash
${INSTALL_CMD}==${BASE_VERSION}
\`\`\`

### All extras

| Extra | Command |
|-------|---------|
| (none) | \`pip install light-server==${BASE_VERSION}\` |
| http | \`pip install light-server[http]==${BASE_VERSION}\` |
| grpc | \`pip install light-server[grpc]==${BASE_VERSION}\` |
| all | \`pip install light-server[all]==${BASE_VERSION}\` |"

          gh release create "${TAG}" \
            --notes "${NOTES}" \
            dist/*

