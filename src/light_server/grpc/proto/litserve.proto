syntax = "proto3";

package lightserver;

service Inference {
  rpc Predict(PredictRequest) returns (PredictResponse);
  rpc StreamPredict(PredictRequest) returns (stream PredictResponse);
  rpc BidirectionalStream(stream StreamChunk) returns (stream StreamChunk);
}

service ModelControl {
  rpc ModelReady(ModelReadyRequest) returns (ModelReadyResponse);
  rpc RepositoryIndex(Empty) returns (RepositoryIndexResponse);
  rpc LoadModel(LoadModelRequest) returns (StatusResponse);
  rpc UnloadModel(UnloadModelRequest) returns (StatusResponse);
}

message PredictRequest {
  string model_name = 1;
  bytes payload = 2;
  map<string, string> metadata = 3;
  string version = 4;
}

message PredictResponse {
  bytes payload = 1;
}

message StreamChunk {
  string stream_id = 1;
  bytes payload = 2;
  bool is_final = 3;
}

message ModelReadyRequest {
  string model_name = 1;
  string version = 2;
}

message ModelReadyResponse {
  bool ready = 1;
}

message LoadModelRequest {
  string model_name = 1;
  string version = 2;
}

message UnloadModelRequest {
  string model_name = 1;
  string version = 2;
}

message StatusResponse {
  bool success = 1;
  string message = 2;
}

message Empty {}

message ModelInfo {
  string name = 1;
  string version = 2;
  string state = 3;
}

message RepositoryIndexResponse {
  repeated ModelInfo models = 1;
}
