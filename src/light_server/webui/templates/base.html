<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Light Server{% endblock %}</title>
  <link rel="stylesheet" href="/ui/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/ui/static/style.css">
  <script src="/ui/static/vendor/htmx.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Light Server</h2>
      <nav>
        <a href="/ui/" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/ui/repository" class="{% if active_page == 'repository' %}active{% endif %}">Repository</a>
        <a href="/ui/benchmarks" class="{% if active_page == 'benchmarks' %}active{% endif %}">Benchmarks</a>
        <a href="/ui/config" class="{% if active_page == 'config' %}active{% endif %}">Config</a>
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
