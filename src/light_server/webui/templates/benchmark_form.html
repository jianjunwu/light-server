{% extends "base.html" %}
{% block title %}New Benchmark - Light Server{% endblock %}
{% block content %}
<h1>New Benchmark</h1>

{% if error %}
<article style="background:#fee2e2;color:#991b1b;padding:0.75rem 1rem;border-radius:var(--pico-border-radius);margin-bottom:1rem;">
  {{ error }}
</article>
{% endif %}

<form method="post" action="/ui/api/benchmarks"
      hx-post="/ui/api/benchmarks"
      hx-target="#benchmark-result"
      hx-swap="innerHTML">
  <div class="grid">
    <label>Model
      <select name="model" required>
        <option value="" disabled selected>Select model</option>
        {% for m in models %}
        <option value="{{ m.name }}">{{ m.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Version
      <input type="text" name="version" value="1" required>
    </label>
    <label>Mode
      <select name="mode">
        <option value="fixed" selected>fixed</option>
        <option value="ramp">ramp</option>
      </select>
    </label>
    <label>Concurrency
      <input type="number" name="concurrency" value="8" min="1" required>
    </label>
    <label>Duration (seconds)
      <input type="number" name="duration" value="30" min="1" required>
    </label>
    <label>Payload (JSON)
      <input type="text" name="payload" value='{"input": 1.0}'>
    </label>
  </div>
  <button type="submit">Start Benchmark</button>
</form>

<div id="benchmark-result"></div>
{% endblock %}
